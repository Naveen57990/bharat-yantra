      <circle cx="971" cy="269" r="5" fill="#83B89B" stroke="#C7E1CF" stroke-width="2"/>

      <rect x="772" y="86" width="196" height="58" rx="14" fill="#0D1918" fill-opacity=".9" stroke="#D4B76D" stroke-opacity=".25"/>
      <text x="790" y="109" fill="#D7C17A" font-size="10" font-weight="600" letter-spacing="1.4">SCENARIO WORKSPACE</text>
      <text x="790" y="129" fill="#E9ECE4" font-size="14" font-weight="600">Compare · Inspect · Plan</text>

      <rect x="1196" y="398" width="153" height="70" rx="14" fill="#0D1918" fill-opacity=".9" stroke="#9DB2A3" stroke-opacity=".22"/>
      <circle cx="1216" cy="420" r="4" fill="#E8A58B"/><text x="1228" y="424" fill="#BBC8BE" font-size="11">Review location</text>
      <circle cx="1216" cy="441" r="4" fill="#D8C076"/><text x="1228" y="445" fill="#BBC8BE" font-size="11">Mapped route</text>
      <circle cx="1216" cy="458" r="4" fill="#83B89B"/><text x="1228" y="462" fill="#BBC8BE" font-size="11">Public facility</text>
