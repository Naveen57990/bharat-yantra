<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bharat Yantra — ward decision laboratory</title>
  <desc id="desc">A conceptual visual of a ward-scale digital map with connected infrastructure, scenario markers, and planning layers. This is not a real geographic map or model result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B19"/>
      <stop offset="1" stop-color="#1A302E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#203431" stop-opacity=".95"/>
      <stop offset="1" stop-color="#132320" stop-opacity=".78"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#B5C7B7" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mapclip"><rect x="742" y="60" width="638" height="438" rx="24"/></clipPath>
  </defs>

  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1190" cy="135" r="250" fill="#D2AE61" fill-opacity=".055"/>
  <circle cx="1370" cy="480" r="300" fill="#77A68E" fill-opacity=".07"/>
  <path d="M0 430C250 350 400 590 700 490S1180 370 1440 450" stroke="#C6AA6A" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M0 462C250 382 400 622 700 522S1180 402 1440 482" stroke="#C6AA6A" stroke-opacity=".08" stroke-width="1.5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
