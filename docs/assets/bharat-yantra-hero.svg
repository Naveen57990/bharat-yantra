    <path d="M77 78h20v3H77zm0 7h20v3H77zm0 7h13v3H77z" fill="#17231F"/>
    <text x="126" y="84" fill="#E9ECE4" font-size="15" font-weight="700" letter-spacing="3">BHARAT YANTRA</text>
    <text x="126" y="105" fill="#9FAFA5" font-size="13" letter-spacing=".6">WARD DECISION LABORATORY</text>

    <rect x="64" y="158" width="248" height="32" rx="16" fill="#D5B86C" fill-opacity=".12" stroke="#D5B86C" stroke-opacity=".35"/>
    <circle cx="82" cy="174" r="4" fill="#D5B86C"/>
    <text x="96" y="179" fill="#DCC782" font-size="12" font-weight="600" letter-spacing="1.5">MUMBAI · WARD-SCALE</text>

    <text x="64" y="258" fill="#F2F0E8" font-size="48" font-weight="650" letter-spacing="-1.4">See the place.</text>
    <text x="64" y="314" fill="#F2F0E8" font-size="48" font-weight="650" letter-spacing="-1.4">Test the decision.</text>
    <text x="67" y="360" fill="#AEBBB1" font-size="18">Explore public-service scenarios through a</text>
    <text x="67" y="387" fill="#AEBBB1" font-size="18">map-linked, evidence-aware planning workspace.</text>

    <g transform="translate(66 430)">
      <rect width="174" height="42" rx="12" fill="url(#panel)" stroke="#9DB2A3" stroke-opacity=".2"/>
      <circle cx="19" cy="21" r="5" fill="#D5B86C"/>
      <text x="34" y="25" fill="#D7DED5" font-size="12" font-weight="600">COMPARE OPTIONS</text>
      <rect x="188" width="154" height="42" rx="12" fill="url(#panel)" stroke="#9DB2A3" stroke-opacity=".2"/>
      <path d="M207 25v-8m5 8v-13m5 13v-5" stroke="#87B99C" stroke-width="2" stroke-linecap="round"/>
      <text x="229" y="25" fill="#D7DED5" font-size="12" font-weight="600">MAP THE IMPACT</text>
      <rect x="356" width="176" height="42" rx="12" fill="url(#panel)" stroke="#9DB2A3" stroke-opacity=".2"/>
      <path d="M375 15h13m-13 6h13m-13 6h8" stroke="#D9987E" stroke-width="2" stroke-linecap="round"/>
      <text x="398" y="25" fill="#D7DED5" font-size="12" font-weight="600">KEEP EVIDENCE VISIBLE</text>
    </g>

