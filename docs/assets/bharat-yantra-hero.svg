      <path d="M840 470 879 363 974 309 1070 339 1150 420 1265 405 1348 315" stroke="#D4E0D9" stroke-opacity=".27" stroke-width="2"/>
      <path d="M994 91 1030 161 1115 177 1166 236 1245 250 1296 322" stroke="#D4E0D9" stroke-opacity=".22" stroke-width="2"/>
      <path d="M895 116 934 173 922 215 971 269 960 278 1004 322" stroke="#D4E0D9" stroke-opacity=".2" stroke-width="2"/>
      <path d="M1160 92 1138 154 1177 201 1150 282 1194 336 1177 406" stroke="#D4E0D9" stroke-opacity=".2" stroke-width="2"/>
      <path d="M1269 118 1238 173 1260 217 1222 282 1265 327 1249 384" stroke="#D4E0D9" stroke-opacity=".2" stroke-width="2"/>
      <path d="M1048 386c-22-18-14-50 12-59 27-10 52 10 47 37-4 25-37 39-59 22Z" fill="#D9987E" fill-opacity=".22" filter="url(#glow)"/>
      <circle cx="1078" cy="347" r="8" fill="#E8A58B" stroke="#F4D6C8" stroke-width="2"/>
      <circle cx="1078" cy="347" r="18" stroke="#E8A58B" stroke-opacity=".45"/>
      <circle cx="1223" cy="217" r="6" fill="#D8C076" stroke="#F1E3B0" stroke-width="2"/>
